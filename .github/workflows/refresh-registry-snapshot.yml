name: Refresh external registry snapshot

on:
  push:
    branches: [agent/consume-specs-registry]
    paths:
      - ".github/workflows/refresh-registry-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hara-specs-registry-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run registry:build
      - name: Verify the canonical catalogue
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const index = JSON.parse(fs.readFileSync("src/generated/registry.json", "utf8"));
          if (index.source?.repository !== "hara-lang/hara-specs-registry") throw new Error("Unexpected registry repository");
          if (!/^[0-9a-f]{40}$/.test(index.source?.ref || "")) throw new Error("Registry snapshot is not pinned to a commit");
          if (index.summary?.specifications !== 50) throw new Error(`Expected 50 specifications, received ${index.summary?.specifications}`);
          if (index.summary?.requirements !== 275) throw new Error(`Expected 275 requirements, received ${index.summary?.requirements}`);
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit the refreshed snapshot
        run: |
          rm .github/workflows/refresh-registry-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/registry.json public/registry/index.json .github/workflows/refresh-registry-snapshot.yml
          git commit -m "Refresh the external specifications registry snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
