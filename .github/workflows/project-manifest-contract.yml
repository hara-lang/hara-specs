name: Project manifest contract

on:
  push:
    branches: [main, production]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Reject superseded project authoring contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          deprecated_tokens = [
              "project" + ".hal",
              "hara" + ".extension.edn",
              "hara" + ".build.edn",
              "hara" + ".recipe.edn",
              "hara" + ".install.edn",
              "hara" + ".package.json",
              "@hara/" + "spec-package",
              "@scope/" + "name",
              "/api/packages/" + "validate",
          ]
          ignored_prefixes = ("src/generated/", "public/registry/")
          findings = []
          for path in Path(".").rglob("*"):
              relative = path.as_posix().lstrip("./")
              if not path.is_file() or ".git" in path.parts or "node_modules" in path.parts or "dist" in path.parts:
                  continue
              if relative.startswith(ignored_prefixes):
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for token in deprecated_tokens:
                  if token in text:
                      findings.append(f"{path}: {token}")
          if findings:
              raise SystemExit("\n".join(findings))
          PY
