</head>
<body>
  <button class="specs-theme-toggle" type="button" data-theme-toggle aria-label="Toggle light and dark mode" title="Toggle light and dark mode" aria-pressed="false">
    <span aria-hidden="true">◐</span>
  </button>
  <aside class="specs-contribution-label" data-contribution-label hidden>
    Greenways contribution · hosted and verified by Hara
  </aside>
  <main id="spec-explorer">
    <section class="hara-explorer-welcome">
      <h1>Hara specifications</h1>
      <p>Loading the specification explorer…</p>
      <p><a href="README.md">Open the specification index</a></p>
    </section>
  </main>
  <script type="module">
    import { createSpecExplorer } from "./vendor/hara-ui/spec-explorer.js";

    const versionParts = (path) => {
      const match = path.match(/(?:^|\/)v(\d+(?:\.\d+)*)\b/i);
      return match ? match[1].split(".").map(Number) : null;
    };
    const compareVersions = (left, right) => {
      for (let index = 0; index < Math.max(left.length, right.length); index += 1) {
        const difference = (left[index] || 0) - (right[index] || 0);
        if (difference) return difference;
      }
      return 0;
    };
    const defaultSpecPath = (files) => {
      const rankStatus = (path) => path.match(/(?:^|\/)(ready|draft)(?:\/|$)/i)?.[1].toLowerCase() === "ready" ? 2 : 1;
      const isReadme = (path) => /(?:^|\/)README\.md$/i.test(path);
      const versioned = files
        .map((file) => ({ file, version: versionParts(file.path) }))
        .filter(({ version }) => version)
        .sort((left, right) => compareVersions(right.version, left.version) || rankStatus(right.file.path) - rankStatus(left.file.path) || Number(isReadme(right.file.path)) - Number(isReadme(left.file.path)) || left.file.path.localeCompare(right.file.path));
      if (versioned.length) {
        const latestVersion = versioned[0].version;
        return versioned.find(({ version, file }) => compareVersions(version, latestVersion) === 0 && isReadme(file.path))?.file.path || versioned[0].file.path;
      }
      const statusFiles = files
        .filter(({ path }) => /(?:^|\/)(ready|draft)(?:\/|$)/i.test(path))
        .sort((left, right) => rankStatus(right.path) - rankStatus(left.path) || Number(isReadme(right.path)) - Number(isReadme(left.path)) || left.path.localeCompare(right.path));
      return statusFiles.find(({ path }) => isReadme(path))?.path || statusFiles[0]?.path || "README.md";
    };

    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (...args) => {
      const response = await nativeFetch(...args);
      const requestUrl = String(args[0]?.url || args[0] || "");
      if (response.ok && requestUrl.match(/spec-manifest\.json(?:$|[?#])/i)) {
        const manifest = await response.json();
        const visibleFiles = (manifest.files || []).filter(({ path }) => path !== "99-archive" && !path.startsWith("99-archive/"));
        const visibleDirectories = (manifest.directories || []).filter((path) => path !== "99-archive" && !path.startsWith("99-archive/"));
        if (!location.hash || location.hash === "#/" || location.hash === "#") {
          history.replaceState(null, "", `#/${encodeURIComponent(defaultSpecPath(visibleFiles))}`);
        }
        return new Response(JSON.stringify({ ...manifest, files: visibleFiles, directories: visibleDirectories }), {
          status: response.status,
          statusText: response.statusText,
          headers: { "Content-Type": "application/json" }
        });
      }
      if (!response.ok || !requestUrl.match(/\.md(?:$|[?#])/i)) return response;
      const source = await response.text();
      const compactSource = source
        .split(/\n\s*\n/)
        .map((block) => block.split(/\r?\n/).join(" "))
        .join("\n\n");
      return new Response(compactSource, {
        status: response.status,
        statusText: response.statusText,
        headers: response.headers
      });
    };

    const toggle = document.querySelector("[data-theme-toggle]");
    const contributionLabel = document.querySelector("[data-contribution-label]");
    const updateContributionLabel = () => {
      const selectedPath = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
      contributionLabel.hidden = !selectedPath.startsWith("00-unsorted/contrib/greenways/");
    };
    addEventListener("hashchange", updateContributionLabel);
    updateContributionLabel();
    createSpecExplorer(document.querySelector("#spec-explorer"), {
      manifestUrl: "spec-manifest.json",
      repositoryUrl: "https://github.com/hara-lang/hara-specs/blob/main",
      titlePrefix: "Hara / Specs"
    });
    const brand = document.querySelector(".hara-spec-brand");
    if (brand) {
      const brandRow = document.createElement("div");
      brandRow.className = "specs-brand-row";
      brand.before(brandRow);
      brandRow.append(brand, toggle);
    }

    const root = document.documentElement;
    const storedTheme = localStorage.getItem("hara-specs-theme");
    const preferredTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

    const setTheme = (theme) => {
      const isLight = theme === "light";
      root.dataset.theme = theme;
      toggle.setAttribute("aria-pressed", String(isLight));
      localStorage.setItem("hara-specs-theme", theme);
    };

    setTheme(storedTheme || preferredTheme);
    toggle.addEventListener("click", () => setTheme(root.dataset.theme === "light" ? "dark" : "light"));
  </script>
</body>
</html>
